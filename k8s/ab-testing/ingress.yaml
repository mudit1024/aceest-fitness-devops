# Default route -> variant A
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab
  namespace: aceest
spec:
  ingressClassName: nginx
  rules:
    - host: ab.__DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-ab-a
                port:
                  number: 80
---
# Variant B routing rules (header > cookie > weight)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-b
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Variant"
    nginx.ingress.kubernetes.io/canary-by-header-value: "B"
    nginx.ingress.kubernetes.io/canary-by-cookie: "ab_variant"
    nginx.ingress.kubernetes.io/canary-weight: "50"
spec:
  ingressClassName: nginx
  rules:
    - host: ab.__DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-ab-b
                port:
                  number: 80
