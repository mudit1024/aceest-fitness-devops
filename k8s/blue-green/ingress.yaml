apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-bg
  namespace: aceest
spec:
  ingressClassName: nginx
  rules:
    - host: bluegreen.__DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-bg
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-bg-preview
  namespace: aceest
spec:
  ingressClassName: nginx
  rules:
    - host: bluegreen-preview.__DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-bg-preview
                port:
                  number: 80
