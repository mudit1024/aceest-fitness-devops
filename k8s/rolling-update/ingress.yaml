apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-rolling
  namespace: aceest
spec:
  ingressClassName: nginx
  rules:
    - host: rolling.__DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-rolling
                port:
                  number: 80
