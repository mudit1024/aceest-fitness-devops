# Local CI stack: Jenkins + SonarQube.
#   docker compose -f jenkins/docker-compose.yml up -d --build
#   Jenkins   -> http://localhost:8080
#   SonarQube -> http://localhost:9000   (first login admin / admin)
services:
  jenkins:
    build: .
    container_name: aceest-jenkins
    user: root            # needed to use the host Docker socket
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKERHUB_USER=${DOCKERHUB_USER:-aceest}
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10.7.0-community
    container_name: aceest-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
